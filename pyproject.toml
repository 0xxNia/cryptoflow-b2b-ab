[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoflow"
version = "0.1.0"
description = "B2B analytics and experimentation skeleton for crypto exchange growth teams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "duckdb>=0.9",
    "streamlit>=1.28",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptoflow*"]
